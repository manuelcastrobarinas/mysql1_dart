name: mysql2
version: 0.24.0
description: A MySQL and MariaDB driver for Dart and Flutter, including Flutter web through a WebSocket bridge.
repository: https://github.com/manuelcastrobarinas/mysql1_dart
homepage: https://github.com/manuelcastrobarinas/mysql1_dart

environment:
  sdk: "^3.0.0"

dependencies:
  collection: ^1.15.0
  crypto: ^3.0.0
  logging: ^1.0.1
  pool: ^1.5.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.16.5

# The key of the certificate the TLS tests present. It protects nothing.
false_secrets:
  - /test/unit/tls/test_server_key_intentionally_public.pem
