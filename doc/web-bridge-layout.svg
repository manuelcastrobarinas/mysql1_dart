<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">mysql2 web bridge layout</title>
  <desc id="desc">A Flutter web page opens a WebSocket to 127.0.0.1 port 8080. The bridge process then opens TCP to MySQL at 127.0.0.1 port 3307.</desc>
  <rect width="960" height="340" fill="#f7f5f1"/>
  <text x="32" y="36" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Two hops. The page never opens port 3307.</text>

  <rect x="32" y="68" width="250" height="210" rx="12" fill="#ffffff" stroke="#1d4e89" stroke-width="2"/>
  <text x="48" y="100" fill="#1d4e89" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Flutter web</text>
  <text x="48" y="128" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="13">The page in the browser.</text>
  <text x="48" y="156" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="13">It can open a WebSocket.</text>
  <text x="48" y="174" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="13">It cannot open TCP.</text>
  <text x="48" y="210" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="12">bridgeUrl</text>
  <text x="48" y="230" fill="#1c1915" font-family="Consolas, monospace" font-size="12">ws://127.0.0.1:8080/mysql</text>
  <text x="48" y="254" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="12">bridgeToken = MYSQL_BRIDGE_TOKEN</text>

  <rect x="355" y="68" width="250" height="210" rx="12" fill="#ffffff" stroke="#1e6b3a" stroke-width="2"/>
  <text x="371" y="100" fill="#1e6b3a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">mysql2 bridge</text>
  <text x="371" y="128" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="13">dart run mysql2:mysql_bridge</text>
  <text x="371" y="156" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="13">Listens only on this PC.</text>
  <text x="371" y="184" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="12">MYSQL_BRIDGE_BIND</text>
  <text x="371" y="204" fill="#1c1915" font-family="Consolas, monospace" font-size="12">127.0.0.1</text>
  <text x="371" y="228" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="12">MYSQL_BRIDGE_PORT</text>
  <text x="371" y="248" fill="#1c1915" font-family="Consolas, monospace" font-size="12">8080</text>

  <rect x="678" y="68" width="250" height="210" rx="12" fill="#ffffff" stroke="#8a5a12" stroke-width="2"/>
  <text x="694" y="100" fill="#8a5a12" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">MySQL</text>
  <text x="694" y="128" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="13">The database process.</text>
  <text x="694" y="156" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="13">The page cannot name it.</text>
  <text x="694" y="184" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="12">MYSQL_HOST</text>
  <text x="694" y="204" fill="#1c1915" font-family="Consolas, monospace" font-size="12">127.0.0.1</text>
  <text x="694" y="228" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="12">MYSQL_PORT</text>
  <text x="694" y="248" fill="#1c1915" font-family="Consolas, monospace" font-size="12">3307</text>

  <line x1="282" y1="160" x2="355" y2="160" stroke="#243044" stroke-width="2"/>
  <polygon points="355,160 345,155 345,165" fill="#243044"/>
  <text x="292" y="150" fill="#243044" font-family="Segoe UI, sans-serif" font-size="11">WebSocket</text>

  <line x1="605" y1="160" x2="678" y2="160" stroke="#243044" stroke-width="2"/>
  <polygon points="678,160 668,155 668,165" fill="#243044"/>
  <text x="618" y="150" fill="#243044" font-family="Segoe UI, sans-serif" font-size="11">TCP</text>

  <text x="32" y="312" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="13">8080 is the door the browser knocks on. 3307 is the door the bridge opens. They are not the same setting.</text>
</svg>
